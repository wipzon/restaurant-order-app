<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Smythe&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>
    
    <body>
    <div class="container">
        <header>
            <img id="banner" src="./images/header.png">
            <div class="header-content">
                <h1>Jimmy's Diner</h1>
                <p>The best burgers and pizzas in town.</p>
            </div>  
        </header>

        <main>
            <div id="menu">
                <!-- Menu items populated by JavaScript -->
            </div>

            <div id="order-summary">
                <h2>Your order</h2>
                <div id="order-list"></div>
                <div id="total-price"></div>
                <button class="complete-order" id="complete-order">Complete order</button>
            </div>
        </main>

        <div class="payement-modal" id="payement-modal">
            <h1>Enter card details</h1>
            <form>
                <label for="name">Full name</label>
                <input placeholder="Full name on card" type="text" id="name" name="name"
                minlength="2" maxlength="30" required>

                <label for="number">Card number</label>
                <input placeholder="1234 5678 9012 3456" type="text" id="number" name="number"
                inputmode="numeric" pattern="[0-9]{16}" maxlength="16" required>

                <label for="ccv">CCV</label>
                <input placeholder="123" type="text" id="ccv" name="ccv"
                inputmode="numeric" pattern="[0-9]{3}" maxlength="3" required>

                <button class="submit" type="submit">Pay</button>
            </form>
        </div>

        <div class="thanks" id="thanks">
            <p>Thanks, James! Your order is on its way!</p>
        </div>

	<script src="index.js" type="module"></script>
    </div>
    </body>
</html>
